{# templates/components/footer.html – Bottom status bar #}

<footer class="footer-bar" role="contentinfo">

  {# Log toggle #}
  <button
    id="log-toggle-btn"
    class="btn-icon"
    title="Toggle log panel"
    data-tooltip="Show log"
    aria-label="Toggle log panel"
    aria-expanded="false"
  >
    <i class="bi bi-chevron-up"></i>
  </button>

  {# Progress bar track #}
  <div class="progress-track" style="flex:1; max-width: 280px;" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Render/download progress">
    <div class="progress-fill" id="footer-progress-fill" style="width:0%"></div>
  </div>

  {# Status text #}
  <span id="footer-status" class="text-xs text-secondary" style="min-width:120px;">Ready</span>

  <div class="flex items-center gap-3" style="margin-left:auto;">
    {# Encoding speed #}
    <div class="flex items-center gap-2 text-xs text-muted">
      <i class="bi bi-speedometer2" aria-hidden="true"></i>
      <span id="footer-speed">—</span>
    </div>

    {# ETA #}
    <div class="flex items-center gap-2 text-xs text-muted">
      <i class="bi bi-clock" aria-hidden="true"></i>
      <span id="footer-eta">—</span>
    </div>

    {# Frame counter #}
    <div class="text-xs font-mono text-muted" id="footer-frame" aria-live="polite"></div>
  </div>

</footer>

{# Log panel (slides up from footer) #}
<div id="log-panel" class="log-panel" role="log" aria-label="Application log" aria-live="polite">
  <div id="log-content"></div>
</div>

{# Toast container #}
<div
  id="toast-container"
  aria-live="polite"
  style="
    position: fixed;
    bottom: calc(var(--footer-h) + 16px);
    right: 20px;
    z-index: 300;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  "
></div>
